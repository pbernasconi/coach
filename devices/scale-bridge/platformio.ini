; Scale bridge: an ESP32-S3 that reads the Renpho Elis 1 over Bluetooth and posts each weigh-in to Coach.
; README.md has the setup. `pio test -e native` runs the protocol tests on the computer, no board needed.

[platformio]
default_envs = atoms3

[env]
framework = arduino
platform = espressif32@6.9.0
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
extra_scripts = pre:version.py
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

; M5Stack AtomS3 Lite and AtomS3U (ESP32-S3, RGB LED on GPIO 35, button on GPIO 41).
[env:atoms3]
board = m5stack-atoms3
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=35

; Any other ESP32-S3 dev board (no status LED).
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

; Over-the-air update after the first USB flash: `pio run -e atoms3-ota -t upload`. ota_auth.py passes OTA_PASSWORD
; from include/config.h (or SCALE_OTA_PASSWORD) to espota and resolves scale-bridge.local itself.
[env:atoms3-ota]
extends = env:atoms3
upload_protocol = espota
upload_port = scale-bridge.local
extra_scripts =
  pre:version.py
  post:ota_auth.py

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++17
test_build_src = no
