---
name: iOS CI

"on":
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (TOOL-3). Update with Dependabot/Renovate, never by hand-typing a tag.
jobs:
  lint-linux:
    # Fast signal: the whole static suite (guard, swift-format, SwiftLint, shellcheck, actionlint,
    # zizmor, yamllint, markdownlint, typos, detect-secrets). No Xcode needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        # The SwiftLint source build is slow; tools.lock changes invalidate the cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios/scripts/lint-all.sh

  core-linux:
    # Pure Core tests run on Linux in seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - name: Core tests
        working-directory: ios/Packages/AppKit
        run: swift test --filter CoreTests

  app-macos:
    runs-on: macos-26
    timeout-minutes: 45
    needs: [lint-linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install xcodegen swiftlint periphery
      - name: Deep lint (build with warnings as errors, dead code)
        run: ios/scripts/lint-all.sh --deep
      - name: Tests
        run: ios/scripts/test.sh
