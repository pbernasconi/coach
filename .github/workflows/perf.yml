# Page speed (scripts/perf.mjs) on production, by hand: Actions → Perf → Run workflow. One run renders about 220
# pages, about 170 MB from Neon before the data cache (src/lib/data-cache.ts), so it does not run on pull requests.
name: Perf

on:
  workflow_dispatch:
    inputs:
      wait_for_idle:
        description: Wait for the database to suspend first, to time the first request after idle
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
      LIFT_SYNC_TOKEN: ${{ secrets.LIFT_SYNC_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      WAIT_FOR_IDLE: ${{ inputs.wait_for_idle && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Measure
        run: node scripts/perf.mjs https://coach.paolobernasconi.com | tee -a "$GITHUB_STEP_SUMMARY"
