# Production deploys (RELIABILITY.md). Vercel does not build main (vercel.json); this workflow puts each merge live:
#   1. build it (a production deployment with no domain yet);
#   2. apply new migrations (additive only, DATABASE.md), so the old build keeps working;
#   3. check the build on the real data, then promote it (an alias swap: production serves it in seconds);
#   4. render every page on coach.paolobernasconi.com; on a failure, promote the build before it again and open
#      an "outage" issue.
# Each deploy counts toward the Hobby plan's 100 deployments a day (a rolling 24 hours), so:
#   - merges a few minutes apart deploy once: each merge waits 4 minutes, and a newer merge cancels the wait;
#   - when that limit stops a deploy, production does not change and the hourly run deploys main again
#     once Vercel has room (no outage issue: nothing is broken).
# Secrets: VERCEL_TOKEN, HEALTH_TOKEN, VERCEL_BYPASS_SECRET, PROD_DATABASE_URL.
name: Deploy

on:
  push:
    branches: [main]
    # Only merges that change the web app: each deploy counts toward the Hobby plan's 100 deployments a day.
    # Later patterns win, so deploy.yml itself still deploys. Keep in step with web.yml's filter.
    paths:
      - "**"
      - "!lift/**"
      - "!ios-standards/**"
      - "!**/*.md"
      - "!scripts/garmin/**"
      - "!.github/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # redeploys main
  schedule:
    - cron: "17 * * * *" # catch up after the daily limit stopped a deploy

permissions:
  contents: read
  issues: write
  actions: write

env:
  PRODUCTION_URL: https://coach.paolobernasconi.com
  VERCEL_ORG_ID: team_Hwpc5IVS3EI80M3wxEu8wK2E
  VERCEL_PROJECT_ID: prj_w56et7EBbNWCBLgA0g3AFys4A6MD
  VERCEL_API: https://api.vercel.com
  VERCEL_CLI: vercel@64.7.0

jobs:
  # A merge waits a few minutes; a newer merge cancels this wait, so a burst of merges deploys only the last one.
  settle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-settle
      cancel-in-progress: true
    steps:
      - run: sleep 240

  # Hourly: when the last deploy stopped at Vercel's daily limit, deploy main again.
  catch-up:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.event != "schedule")]')
          if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -gt 0 ]; then
            echo "A deploy is running or waiting: nothing to do."
            exit 0
          fi
          run=$(jq -r '.[0].id // empty' <<<"$runs")
          [ -n "$run" ] || exit 0
          limited=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
            --jq '[.jobs[].steps[] | select(.name == "Vercel daily limit" and .conclusion == "failure")] | length')
          if [ "$limited" -gt 0 ]; then
            echo "Run $run stopped at the daily limit: deploying main again."
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Run $run did not stop at the daily limit: nothing to do."
          fi

  deploy:
    needs: settle
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.settle.result == 'success' || needs.settle.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Find the live build
        id: find
        run: |
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$VERCEL_API/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.targets.production.id')
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "live now $live"

      - name: Pending migrations?
        id: migrations
        run: |
          applied=$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM drizzle.__drizzle_migrations')
          want=$(jq '.entries | length' drizzle/meta/_journal.json)
          echo "$applied applied, $want in this commit"
          echo "pending=$([ "$applied" -lt "$want" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: node-modules-Web-node22-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply migrations
        if: steps.migrations.outputs.pending == 'true'
        run: node scripts/db/migrate.mjs --yes

      - name: Build
        id: build
        env:
          SKIP_BUILD_TYPECHECK: "1" # the pull request's "web checks" type-checked this code
          SKIP_DB_MIGRATE: "1" # migrated above
        run: |
          npx -y "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" >/dev/null
          DATABASE_URL=postgresql://build:build@localhost:5432/build npx -y "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
          # --archive=tgz uploads a few archive files, not every changed file (the Hobby plan allows 5,000 a day).
          if ! out=$(npx -y "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --archive=tgz --token "$VERCEL_TOKEN" \
            --meta builtSha="$GITHUB_SHA" 2>&1); then
            echo "$out"
            if grep -qE 'api-deployments-free-per-day|api-upload-free|Resource is limited' <<<"$out"; then
              echo "limited=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' <<<"$out" | head -1)
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$VERCEL_API/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Its own step, so the hourly catch-up can find it by name.
      - name: Vercel daily limit
        if: steps.build.outputs.limited == 'true'
        run: |
          echo "::error::A Vercel daily limit is reached. Production did not change. The hourly run deploys main again once there is room."
          exit 1

      - name: Check the build before it goes live
        id: target
        run: |
          id="${{ steps.build.outputs.id }}"
          url=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$VERCEL_API/v13/deployments/$id?teamId=$VERCEL_ORG_ID" | jq -r .url)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          node scripts/smoke.mjs "https://$url"

      - name: Promote
        id: promote
        run: |
          status=$(curl -sS -o /tmp/promote.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v10/projects/$VERCEL_PROJECT_ID/promote/${{ steps.target.outputs.id }}?teamId=$VERCEL_ORG_ID")
          echo "promote: HTTP $status"
          case "$status" in 2*) ;; *) cat /tmp/promote.json; exit 1 ;; esac
          echo "Promoted ${{ steps.target.outputs.id }} (was ${{ steps.find.outputs.live }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Check production
        id: production
        run: node scripts/smoke.mjs "$PRODUCTION_URL" --pages --expect-deployment "${{ steps.target.outputs.id }}"

      - name: Roll back
        id: rollback
        if: failure() && steps.promote.outcome == 'success'
        run: |
          live="${{ steps.find.outputs.live }}"
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v10/projects/$VERCEL_PROJECT_ID/promote/$live?teamId=$VERCEL_ORG_ID"
          echo "Promoted $live again"
          echo "to=$live" >> "$GITHUB_OUTPUT"

      - name: Open or update the outage issue
        if: failure() && steps.build.outputs.limited != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLED_BACK_TO: ${{ steps.rollback.outputs.to }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$ROLLED_BACK_TO" ]; then
            note="Deploy of ${GITHUB_SHA:0:7} failed its check on production; production is back on $ROLLED_BACK_TO. Fix on main: the next merge deploys as usual."
          else
            note="Deploy of ${GITHUB_SHA:0:7} stopped before it went live; production did not change. Fix on main, or rerun this workflow."
          fi
          body="$(printf 'Coach deploy failed.\n\n%s\n\nRun: %s' "$note" "$run_url")"
          gh label create outage --color B60205 --description "Coach smoke check failed" 2>/dev/null || true
          existing=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Coach deploy failed" --label outage --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
