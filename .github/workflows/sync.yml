# Calls Coach's sync routes on a schedule. Vercel Hobby crons run only once a day, and GitHub's scheduled
# workflows are free for this public repository. GitHub starts scheduled runs late, by hours at the top of the
# hour (runs came 2 to 6 hours apart on 2026-10-20 and 21), so this runs off the hour.
# GitHub turns off schedules after 60 days without commits; re-enable in Actions if that happens.
#
# Neon compute: each wake-up of the database costs at least 5 minutes of compute (it suspends after 5 idle
# minutes). So this is the only hourly schedule that touches the database. The deploy check (deploy-check.yml) and
# the Garmin workout push (garmin.yml) start when this run ends, while the database is still awake.
name: Sync

on:
  schedule:
    - cron: "17 * * * *" # calendar and the Zwift rides (through intervals.icu) every hour; Strava every 3 hours
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calendar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://coach.paolobernasconi.com/api/cron/calendar
      - name: Zwift rides (intervals.icu)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://coach.paolobernasconi.com/api/cron/workouts
      - name: Strava
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] && [ $(( 10#$(date -u +%H) % 3 )) -ne 0 ]; then
            echo "Strava runs every 3 hours; not this hour."
            exit 0
          fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://coach.paolobernasconi.com/api/cron/strava
      - name: BodySpec DEXA scans
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT: ${{ github.event_name }}
        run: |
          # Once a day: new scans are rare, and a daily token refresh keeps the BodySpec sign-in alive.
          # The answer has counts and dates only (this log is public).
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "16" ]; then
            echo "BodySpec runs once a day (16:17 UTC); not this hour."
            exit 0
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://coach.paolobernasconi.com/api/cron/bodyspec
      - name: Sunday plan for next week
        if: ${{ !cancelled() }} # even when a sync step above failed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Sundays from 15:17 UTC (08:17 PDT): the planner plans next week (Claude API, in Coach). The first call starts
          # it; later calls see the week has a request and do nothing. Answers hold ids and reasons only.
          if [ "$(date -u +%u)" != "7" ] || [ "$(date -u +%H)" -lt 15 ]; then
            echo "The Sunday plan runs on Sundays from 15:17 UTC; not now."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" -H 'content-type: application/json' \
            -d '{}' https://coach.paolobernasconi.com/api/plan/run
