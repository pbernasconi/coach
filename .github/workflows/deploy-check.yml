# Checks production on the real data (scripts/smoke.mjs, /api/health). Production deploys are checked by the Deploy
# workflow (deploy.yml), which rolls back a failed one; previews by preview.yml.
# - Every 30 minutes, and by hand: production, every page. Data alone can break a page (the 2026-10-19 outage),
#   so this catches a failure that no deploy caused. It opens an issue; it does not roll back (the old build reads
#   the same data).
# Secrets: HEALTH_TOKEN (also in Vercel, Production and Preview), VERCEL_BYPASS_SECRET.
name: Deploy check

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-check-${{ github.event.deployment.environment || 'production' }}
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://coach.paolobernasconi.com

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
      IS_PREVIEW: ${{ github.event_name == 'deployment_status' }}
      DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # The deployed commit's own smoke script (its pages and markers); main for production.
          ref: ${{ github.event.deployment.sha || 'main' }}

      - name: Smoke check (preview)
        if: env.IS_PREVIEW == 'true'
        run: node scripts/smoke.mjs "$DEPLOY_URL"

      - name: Smoke check (production)
        if: env.IS_PREVIEW != 'true'
        run: node scripts/smoke.mjs "$PRODUCTION_URL" --pages

      - name: Open or update the outage issue
        if: failure() && env.IS_PREVIEW != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf 'Coach failed its scheduled smoke check: production is broken without a new deploy (likely data). Not rolled back.\n\nRun: %s' "$run_url")"
          gh label create outage --color B60205 --description "Coach smoke check failed" 2>/dev/null || true
          existing=$(gh issue list --label outage --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Coach is down: smoke check failed" --label outage --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
