---
name: TestFlight

# Archives the Lift app and uploads it to App Store Connect (TestFlight). Builds are batched, not one per merge:
# an hourly run uploads only when the app changed since the last successful upload, and "Run workflow" uploads
# now. Until the App Store Connect API key and the Apple identifiers
# are configured, the job explains what is missing and stops without failing. Setup steps: lift/DEFERRED.md.
"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the hourly check reads the last successful run

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  changes:
    # Scheduled runs skip when nothing under the app changed since the last successful upload.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did the app change since the last upload?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/testflight.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No earlier upload found; building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$last" HEAD -- lift/ios ios-standards/Kobo .github/workflows/testflight.yml)
          if [ -n "$changed" ]; then
            echo "Changed since $last:"; echo "$changed" | head -50
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No app changes since the last upload ($last); skipping this hour's build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      # Not secret: identifiers only. Repository secrets or variables of the same name override them.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'TTPPF7B89U' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '69a6de7d-2335-47e3-e053-5b8c7c11a4d1' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || '36K65DLG2U' }}
      BUNDLE_ID: ${{ vars.LIFT_BUNDLE_ID || 'com.pbernasconi.lift' }}
      SYNC_BASE_URL: ${{ vars.LIFT_SYNC_BASE_URL }}   # optional; empty leaves sync off in the build
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight upload skipped. Missing:$missing (see lift/DEFERRED.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Write the App Store Connect key
        if: steps.config.outputs.ready == 'true'
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Revoke the certificates of earlier runs
        # Leftovers from runs without the stored certificate; Apple stops the archive when the account is full.
        if: steps.config.outputs.ready == 'true'
        env:
          LIFT_CERT_ID: ${{ vars.LIFT_CERT_ID }}
        run: python3 lift/ios/scripts/asc-revoke-ci-certs.py
      - name: Import the signing certificate
        # One stored Apple Development certificate (lift/DEFERRED.md), so automatic signing does not make a new one
        # on each runner. Without the secret, automatic signing makes one, as before.
        if: steps.config.outputs.ready == 'true'
        env:
          LIFT_CERT_P12: ${{ secrets.LIFT_CERT_P12 }}
          LIFT_CERT_PASSWORD: ${{ secrets.LIFT_CERT_PASSWORD }}
        run: |
          if [ -z "$LIFT_CERT_P12" ]; then
            echo "::warning::LIFT_CERT_P12 is not set; automatic signing makes a new certificate on this runner."
            exit 0
          fi
          keychain="$RUNNER_TEMP/lift-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$LIFT_CERT_P12" | base64 --decode > "$RUNNER_TEMP/lift.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/lift.p12" -k "$keychain" -P "$LIFT_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/lift.p12"
          security find-identity -v -p codesigning "$keychain"
      - name: Generate the Xcode project
        if: steps.config.outputs.ready == 'true'
        working-directory: lift/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Archive
        if: steps.config.outputs.ready == 'true'
        working-directory: lift/ios
        run: |
          xcodebuild archive \
            -project Lift.xcodeproj \
            -scheme Lift \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Lift.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            LIFT_BUNDLE_ID="$BUNDLE_ID" \
            LIFT_SYNC_BASE_URL="$SYNC_BASE_URL" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Upload to App Store Connect
        if: steps.config.outputs.ready == 'true'
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lift.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/lift.p12"
          security delete-keychain "$RUNNER_TEMP/lift-signing.keychain-db" 2>/dev/null || true

  processing:
    # An upload can still fail Apple's processing or wait on export compliance; this job reports it. It does not
    # fail the run, so the hourly check does not upload the same app again every hour.
    needs: upload
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Wait for App Store Connect to process the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'TTPPF7B89U' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '69a6de7d-2335-47e3-e053-5b8c7c11a4d1' }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: ${{ vars.LIFT_BUNDLE_ID || 'com.pbernasconi.lift' }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "No App Store Connect key; nothing uploaded."; exit 0; fi
          python3 lift/ios/scripts/asc-builds.py --wait "$GITHUB_RUN_NUMBER"
