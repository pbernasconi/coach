# Web app checks on every pull request and on main. Branch protection requires "web checks", "web build"
# and "web integration" before a merge (the iOS jobs in ios.yml do not check the web app). The three jobs run
# in parallel; each restores node_modules from a cache keyed by package-lock.json and runs npm ci only on a miss.
# "web build" also stages the production build that a merge promotes (deploy.yml, RELIABILITY.md).
name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_MODULES_KEY: node-modules-${{ github.workflow }}-node22-v1

jobs:
  checks:
    name: web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: ${{ env.NODE_MODULES_KEY }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations match the schema
        # A schema change without its migration makes drizzle-kit generate write a new file here.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::src/db/*schema*.ts changed without a migration. Run npm run db:generate and commit drizzle/."
            exit 1
          fi

  build:
    # On a pull request that changes the web app: the production output (vercel build --prod), uploaded as a
    # staged production deployment (no domain) and checked on the real data. The Deploy workflow promotes it at
    # the merge (deploy.yml). Otherwise (main, iOS-only pull requests, drafts): a plain next build.
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a pull request's files through the API
    env:
      VERCEL_ORG_ID: team_Hwpc5IVS3EI80M3wxEu8wK2E
      VERCEL_PROJECT_ID: prj_w56et7EBbNWCBLgA0g3AFys4A6MD
      VERCEL_CLI: vercel@64.7.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: ${{ env.NODE_MODULES_KEY }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Did the web app change?
        id: changes
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            web:
              - "**"
              - "!lift/**"
              - "!ios-standards/**"
              - "!**/*.md"
              - "!.github/workflows/ios.yml"
      - name: Build
        env:
          # The build only needs a well-formed URL (neon() checks the format when a route module loads).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          # "web checks" runs tsc at the same time (next.config.ts).
          SKIP_BUILD_TYPECHECK: "1"
          # Staged builds migrate at the merge (deploy.yml), never here.
          SKIP_DB_MIGRATE: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ steps.changes.outputs.web }}" = true ]; then
            npx -y "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" >/dev/null
            npx -y "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
            echo "STAGE=1" >> "$GITHUB_ENV"
          else
            npm run build
          fi
      - name: Stage the production build
        if: env.STAGE == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The tree of the pull request merged into main: equal to the merge commit's tree when main does not move.
          tree=$(git rev-parse 'HEAD^{tree}')
          out=$(npx -y "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN" \
            --meta stagedTree="$tree" --meta stagedPr="$PR" --meta stagedSha="$GITHUB_SHA")
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' <<<"$out" | head -1)
          [ -n "$url" ] || { echo "$out"; echo "::error::no deployment URL"; exit 1; }
          echo "Staged $url for tree ${tree:0:7}"
          # The loaders on the production data, before any merge. A pull request with migrations production has not
          # applied cannot run them yet (its loaders read the new tables): deploy.yml checks the build at the merge,
          # after the migrations, before the promote; "web integration" ran every loader on the migrated schema.
          applied=$(psql "$PROD_DATABASE_URL" -Atc 'SELECT count(*) FROM drizzle.__drizzle_migrations')
          want=$(jq '.entries | length' drizzle/meta/_journal.json)
          if [ "$applied" -lt "$want" ]; then
            echo "$((want - applied)) new migration(s): the check of this build runs at the merge, after they are applied."
          else
            node scripts/smoke.mjs "$url" --staged
          fi
          echo "Staged production build: $url (tree \`${tree:0:12}\`). Merging promotes it." >> "$GITHUB_STEP_SUMMARY"

  integration:
    # Every page loader on a real Postgres, with times as Date objects and as text (src/lib/health.ts).
    name: web integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17 # production runs Postgres 17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coach
      DATABASE_DRIVER: pg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: ${{ env.NODE_MODULES_KEY }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build the schema from the migrations
        run: npm run db:migrate
      - run: npm run test:integration
