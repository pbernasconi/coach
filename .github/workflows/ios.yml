---
name: iOS

"on":
  push:
    branches: [main, ios-standards]
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (TOOL-3).
jobs:
  lint:
    # The full static suite on Linux: guard, conformance, swift-format, SwiftLint, Linux logic tests and the
    # non-Swift linters. Fast signal before the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios-standards/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios-standards/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios-standards/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios-standards/scripts/lint-all.sh

  changes:
    # Which parts changed, so the package tests run only when Kobo, LiftKit or this workflow changed.
    # The app and screenshot jobs always run: they compile both packages.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a pull request's files through the API
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            packages:
              - "ios-standards/Kobo/**"
              - "lift/ios/Packages/**"
              - ".github/workflows/ios.yml"

  packages:
    # Kobo and LiftKit tests on macOS (the real SwiftUI SDK), side by side in one job: one macOS runner instead
    # of two keeps this workflow within the five concurrent macOS jobs a free account gets.
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-packages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Kobo and LiftKit tests
        run: |
          (cd ios-standards/Kobo && swift test > "$RUNNER_TEMP/kobo.log" 2>&1) & kobo=$!
          (cd lift/ios/Packages/LiftKit && swift test > "$RUNNER_TEMP/liftkit.log" 2>&1) & liftkit=$!
          status=0
          wait "$kobo" || status=1
          wait "$liftkit" || status=1
          for name in kobo liftkit; do
            log="$RUNNER_TEMP/$name.log"
            echo "::group::$name (tail)"
            tail -n 20 "$log"
            echo "::endgroup::"
            echo "::group::Unique errors ($name)"
            grep -E "(error|warning):|✘|recorded an issue" "$log" | grep -v "^ *|" | sort -u | head -n 150 || true
            echo "::endgroup::"
          done
          exit "$status"

  app:
    # The app: generate the Xcode project, build for testing, run the unit tests on a simulator. It also compiles
    # Kobo for iOS. The simulator boots while the build runs; the compilation cache and SwiftPM checkouts are
    # restored from the last run and saved after the build (even when tests fail).
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        id: sim
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          echo "xcode=$(basename "$(dirname "$(dirname "$(xcode-select -p)")")" .app)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
          restore-keys: lift-cas-${{ steps.sim.outputs.xcode }}-
      - name: Generate the Xcode project
        working-directory: lift/ios
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build for testing
        run: lift/ios/scripts/ci-xcodebuild.sh lift-build.log build-for-testing
      - name: Save SwiftPM checkouts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
      - name: Unit test
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          lift/ios/scripts/ci-xcodebuild.sh lift-test.log test-without-building -disableAutomaticPackageResolution

  screenshots:
    # Demo screenshots, one job per variant (light, dark, AX3), in parallel with the app job. Each builds the same
    # way as the app job, so it gets its compilation cache; the simulator boots while the build runs.
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [light, dark, ax3]
    concurrency:
      group: ios-screenshots-${{ matrix.variant }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        id: sim
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          echo "xcode=$(basename "$(dirname "$(dirname "$(xcode-select -p)")")" .app)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
          restore-keys: lift-cas-${{ steps.sim.outputs.xcode }}-
      - name: Generate the Xcode project
        working-directory: lift/ios
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build
        run: lift/ios/scripts/ci-xcodebuild.sh lift-build.log build-for-testing
      - name: Screenshots
        env:
          VARIANTS: ${{ matrix.variant }}
        run: |
          lift/ios/scripts/screenshots.sh build/lift/Build/Products/Debug-iphonesimulator/Lift.app screenshots
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-screenshots-${{ matrix.variant }}
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
