---
name: iOS

"on":
  push:
    branches: [main, ios-standards]
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (TOOL-3).
jobs:
  lint:
    # The full static suite on Linux: guard, conformance, swift-format, SwiftLint, Linux logic tests and the
    # non-Swift linters. Fast signal before the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios-standards/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios-standards/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios-standards/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios-standards/scripts/lint-all.sh

  kobo:
    # Kobo tests with the real SwiftUI SDK (macOS).
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-kobo-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Kobo tests (macOS)
        working-directory: ios-standards/Kobo
        run: |
          status=0
          swift test > ../../kobo-macos.log 2>&1 || status=$?
          tail -n 20 ../../kobo-macos.log
          echo "::group::Unique errors (Kobo)"
          grep -E "(error|warning):|✘|recorded an issue" ../../kobo-macos.log | grep -v "^ *|" | sort -u | head -n 150 || true
          echo "::endgroup::"
          exit "$status"

  liftkit:
    # LiftKit tests (domain, store, sync) on macOS.
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-liftkit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: LiftKit tests
        working-directory: lift/ios/Packages/LiftKit
        run: |
          status=0
          swift test > ../../../../liftkit.log 2>&1 || status=$?
          tail -n 20 ../../../../liftkit.log
          echo "::group::Unique errors (LiftKit)"
          grep -E "(error|warning):|✘|recorded an issue" ../../../../liftkit.log | grep -v "^ *|" | sort -u | head -n 150 || true
          echo "::endgroup::"
          exit "$status"

  app:
    # The app: generate the Xcode project, build for testing, run the unit tests on a simulator. It also compiles
    # Kobo for iOS. The simulator boots while the build runs; the compilation cache and SwiftPM checkouts are
    # restored from the last run and saved after the build (even when tests fail).
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        id: sim
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
          restore-keys: lift-cas-${{ steps.sim.outputs.xcode }}-
      - name: Generate the Xcode project
        working-directory: lift/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build for testing
        run: lift/ios/scripts/ci-xcodebuild.sh lift-build.log build-for-testing
      - name: Save SwiftPM checkouts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
      - name: Unit test
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          lift/ios/scripts/ci-xcodebuild.sh lift-test.log test-without-building
      - name: Cache sizes
        if: ${{ !cancelled() }}
        run: du -sh build/* || true

  screenshots:
    # Demo screenshots (light, dark, AX3) from the same build-for-testing as the app job, so it shares its
    # compilation cache. Runs in parallel with the app job; the simulator boots while the build runs.
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        id: sim
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ steps.sim.outputs.xcode }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Restore the compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ steps.sim.outputs.xcode }}-${{ github.sha }}
          restore-keys: lift-cas-${{ steps.sim.outputs.xcode }}-
      - name: Generate the Xcode project
        working-directory: lift/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build
        run: lift/ios/scripts/ci-xcodebuild.sh lift-build.log build-for-testing
      - name: Screenshots
        run: |
          lift/ios/scripts/screenshots.sh build/lift/Build/Products/Debug-iphonesimulator/Lift.app screenshots
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
