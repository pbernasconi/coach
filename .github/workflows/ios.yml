---
name: iOS

"on":
  push:
    branches: [main, ios-standards]
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (TOOL-3).
jobs:
  changes:
    # Decides whether the macOS jobs run. A pull request that changes no app code (only Markdown, the Lift
    # server scripts or the iOS standards' docs and scripts) gets the Linux lint only. Pushes and manual runs
    # always build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read  # paths-filter lists a pull request's files through the API
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - name: Did app code change?
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            app:
              - "{lift/ios,ios-standards/Kobo}/**"
              - "!**/*.md"
            workflow:
              - ".github/workflows/ios.yml"

  lint:
    # The full static suite on Linux: guard, conformance, swift-format, SwiftLint, Linux logic tests and the
    # non-Swift linters. Fast signal before the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ios-lint-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios-standards/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios-standards/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios-standards/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios-standards/scripts/lint-all.sh

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Builds the app and its unit tests once (build-for-testing) and hands the products to the simulator jobs.
    # No simulator boots here, so the cache restore and the build get the whole machine. Xcode's compilation
    # cache (build/cas) comes from the last run and is saved after the upload, even when a later job fails.
    # It also compiles Kobo for iOS.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists a pull request's files through the API
    concurrency:
      group: ios-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        # XcodeGen's release binary, checked by hash: faster than brew.
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd lift/ios && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate)
          echo "XCODE=$(basename "$(dirname "$(dirname "$(xcode-select -p)")")" .app)" >> "$GITHUB_ENV"
      - name: Restore SwiftPM checkouts
        # Saves xcodebuild's GRDB clone (about 45 s). Restoring them is quick here, with no simulator booting.
        id: spm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ env.XCODE }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ env.XCODE }}-${{ github.sha }}
          restore-keys: lift-cas-${{ env.XCODE }}-
      - name: Build the app
        # The app alone first, so the screenshot jobs can start before the tests are compiled.
        run: lift/ios/scripts/ci-xcodebuild.sh app lift-app.log
      - name: Pack the app
        run: lift/ios/scripts/ci-products.sh pack app "$RUNNER_TEMP/lift-app.tar.zst"
      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-app
          path: ${{ runner.temp }}/lift-app.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Build for testing
        run: lift/ios/scripts/ci-xcodebuild.sh build lift-build.log
      - name: Pack the products
        run: lift/ios/scripts/ci-products.sh pack tests "$RUNNER_TEMP/lift-products.tar.zst"
      - name: Upload the products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-products
          path: ${{ runner.temp }}/lift-products.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Save SwiftPM checkouts
        if: ${{ !cancelled() && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/spm
          key: lift-spm-${{ env.XCODE }}-${{ hashFiles('lift/ios/Packages/LiftKit/Package.resolved') }}
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ env.XCODE }}-${{ github.sha }}
      - name: Did a package change?
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            packages:
              - "ios-standards/Kobo/**"
              - "lift/ios/Packages/**"
              - ".github/workflows/ios.yml"
      - name: Kobo and LiftKit tests
        # macOS, the real SwiftUI SDK. Last, after the uploads, and only when a package (or this workflow)
        # changed or the run was started by hand: the app build above compiles both packages either way.
        if: ${{ !cancelled() && (steps.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          lift/ios/scripts/ci-package-tests.sh start ios-standards/Kobo
          lift/ios/scripts/ci-package-tests.sh start lift/ios/Packages/LiftKit
          status=0
          lift/ios/scripts/ci-package-tests.sh wait ios-standards/Kobo || status=1
          lift/ios/scripts/ci-package-tests.sh wait lift/ios/Packages/LiftKit || status=1
          exit "$status"
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # The app's unit tests on a simulator, from the build job's products. It starts with the build job rather
    # than after it, so the simulator has booted when the products arrive. The simulator boots from a cached
    # snapshot of one that booted before (keyed by runner image, runtime and device); when there is none, the
    # job saves one at its end.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # ci-products.sh polls this run's artifacts and jobs
    concurrency:
      group: ios-test-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Simulator snapshot key
        run: lift/ios/scripts/ci-simulator.sh key
      - name: Restore the simulator snapshot
        id: simcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/sim-data
          key: ${{ env.SIM_CACHE_KEY }}
          restore-keys: ${{ env.SIM_CACHE_PREFIX }}
      - name: Boot the simulator in the background
        run: lift/ios/scripts/ci-simulator.sh boot
      - name: Wait for the build job's products
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: lift/ios/scripts/ci-products.sh fetch lift-products build/products
      - name: Wait for the simulator
        if: ${{ !cancelled() }}
        run: lift/ios/scripts/ci-simulator.sh ready
      - name: Unit test
        if: ${{ !cancelled() }}
        run: lift/ios/scripts/ci-xcodebuild.sh test lift-test.log build/products/*.xctestrun
      - name: Pack the simulator snapshot
        if: ${{ !cancelled() && steps.simcache.outputs.cache-matched-key == '' }}
        run: lift/ios/scripts/ci-simulator.sh pack
      - name: Save the simulator snapshot
        if: ${{ !cancelled() && steps.simcache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/sim-data
          key: ${{ env.SIM_CACHE_KEY }}

  screenshots:
    needs: changes
    # Pushes to main (each merge) and manual runs only, not pull requests: a pull request gets lint, build and
    # unit tests, and its screenshots come from the merge. The screenshots are for review; nothing compares them.
    if: needs.changes.outputs.app == 'true' && github.event_name != 'pull_request'
    # Demo screenshots, one job per variant (light, dark, AX3), from the build job's app. Like the test job it
    # starts with the build job and boots its simulator while it waits, and saves a simulator snapshot when
    # there was none for its runner image (images rotate, so any simulator job may be the first).
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # ci-products.sh polls this run's artifacts and jobs
    strategy:
      fail-fast: false
      matrix:
        variant: [light, dark, ax3]
    concurrency:
      group: ios-shots-${{ matrix.variant }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Simulator snapshot key
        run: lift/ios/scripts/ci-simulator.sh key
      - name: Restore the simulator snapshot
        id: simcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/sim-data
          key: ${{ env.SIM_CACHE_KEY }}
          restore-keys: ${{ env.SIM_CACHE_PREFIX }}
      - name: Boot the simulator in the background
        run: lift/ios/scripts/ci-simulator.sh boot
      - name: Wait for the build job's app
        env:
          GH_TOKEN: ${{ github.token }}
        run: lift/ios/scripts/ci-products.sh fetch lift-app build/products
      - name: Install the app
        run: lift/ios/scripts/ci-simulator.sh install build/products/Debug-iphonesimulator/Lift.app
      - name: Wait for the simulator
        run: lift/ios/scripts/ci-simulator.sh ready
      - name: Screenshots
        env:
          VARIANTS: ${{ matrix.variant }}
          # A simulator booted from the snapshot has shown its first-boot notices already.
          WARMUP_LAUNCH: ${{ steps.simcache.outputs.cache-matched-key != '' && '0' || '1' }}
          SKIP_INSTALL: "1"
        run: lift/ios/scripts/screenshots.sh build/products/Debug-iphonesimulator/Lift.app screenshots
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-screenshots-${{ matrix.variant }}
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Pack the simulator snapshot
        if: ${{ !cancelled() && steps.simcache.outputs.cache-matched-key == '' }}
        run: lift/ios/scripts/ci-simulator.sh pack
      - name: Save the simulator snapshot
        if: ${{ !cancelled() && steps.simcache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/sim-data
          key: ${{ env.SIM_CACHE_KEY }}
