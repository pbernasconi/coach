---
name: iOS

"on":
  push:
    branches: [main, ios-standards]
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (TOOL-3).
jobs:
  lint:
    # The full static suite on Linux: guard, conformance, swift-format, SwiftLint, Linux logic tests and the
    # non-Swift linters. Fast signal before the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ios-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios-standards/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios-standards/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios-standards/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios-standards/scripts/lint-all.sh

  kobo:
    # Kobo tests with the real SwiftUI SDK (macOS).
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-kobo-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Kobo tests (macOS)
        working-directory: ios-standards/Kobo
        run: |
          status=0
          swift test > ../../kobo-macos.log 2>&1 || status=$?
          tail -n 20 ../../kobo-macos.log
          echo "::group::Unique errors (Kobo)"
          grep -E "(error|warning):|✘|recorded an issue" ../../kobo-macos.log | grep -v "^ *|" | sort -u | head -n 150 || true
          echo "::endgroup::"
          exit "$status"

  liftkit:
    # LiftKit tests (domain, store, sync) on macOS.
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-liftkit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: LiftKit tests
        working-directory: lift/ios/Packages/LiftKit
        run: |
          status=0
          swift test > ../../../../liftkit.log 2>&1 || status=$?
          tail -n 20 ../../../../liftkit.log
          echo "::group::Unique errors (LiftKit)"
          grep -E "(error|warning):|✘|recorded an issue" ../../../../liftkit.log | grep -v "^ *|" | sort -u | head -n 150 || true
          echo "::endgroup::"
          exit "$status"

  app:
    # The app: generate the Xcode project, build, run unit tests on a simulator, and capture demo screenshots
    # (light, dark, AX3). It also compiles Kobo for iOS.
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: ios-app-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        working-directory: lift/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build and unit test
        working-directory: lift/ios
        run: |
          udid="$(scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          status=0
          xcodebuild test \
            -project Lift.xcodeproj \
            -scheme Lift \
            -destination "id=$udid" \
            -derivedDataPath ../../build/lift \
            CODE_SIGNING_ALLOWED=NO \
            > ../../lift-app.log 2>&1 || status=$?
          tail -n 25 ../../lift-app.log
          echo "::group::Unique errors (Lift app)"
          grep -E "(error|warning):|✘|recorded an issue|\*\* (BUILD|TEST) " ../../lift-app.log \
            | grep -v "^ *|" | sort -u | head -n 150 || true
          echo "::endgroup::"
          exit "$status"
      - name: Screenshots
        if: ${{ !cancelled() }}
        run: |
          app="$(find build/lift/Build/Products -maxdepth 2 -path '*iphonesimulator/Lift.app' | head -n 1)"
          if [ -z "$app" ] || [ ! -x "$app/Lift" ]; then echo "no app build to screenshot"; exit 0; fi
          lift/ios/scripts/screenshots.sh "$app" screenshots
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
