---
name: iOS

"on":
  push:
    branches: [main, ios-standards]
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-standards/**"
      - "lift/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA (TOOL-3).
jobs:
  lint:
    # The full static suite on Linux: guard, conformance, swift-format, SwiftLint, Linux logic tests and the
    # non-Swift linters. Fast signal before the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ios-lint-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a  # v2.4.0
        with:
          swift-version: "6.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Cache pinned lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios-standards/.tools
          key: lint-tools-${{ runner.os }}-${{ hashFiles('ios-standards/scripts/tools.lock') }}
      - name: Install pinned lint tools
        run: ios-standards/scripts/install-tools.sh --swiftlint
      - name: Lint
        run: ios-standards/scripts/lint-all.sh

  build:
    # Builds the app and its unit tests once (build-for-testing) and hands the products to the simulator jobs.
    # No simulator boots here, so the cache restore and the build get the whole machine. Xcode's compilation
    # cache (build/cas) comes from the last run and is saved after the upload, even when a later job fails.
    # SwiftPM checkouts are not cached: restoring their 260 MB archive took longer than xcodebuild's own clone.
    # It also compiles Kobo for iOS, and runs the Kobo and LiftKit tests (macOS, the real SwiftUI SDK) last.
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        # XcodeGen's release binary, checked by hash: faster than brew.
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          (cd lift/ios && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate)
          echo "XCODE=$(basename "$(dirname "$(dirname "$(xcode-select -p)")")" .app)" >> "$GITHUB_ENV"
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ env.XCODE }}-${{ github.sha }}
          restore-keys: lift-cas-${{ env.XCODE }}-
      - name: Build for testing
        run: lift/ios/scripts/ci-xcodebuild.sh build lift-build.log
      - name: Pack the products
        run: lift/ios/scripts/ci-products.sh pack "$RUNNER_TEMP/lift-products.tar.zst"
      - name: Upload the products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-products
          path: ${{ runner.temp }}/lift-products.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.cas.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/cas
          key: lift-cas-${{ env.XCODE }}-${{ github.sha }}
      - name: Kobo and LiftKit tests
        # After the products are out: the simulator jobs need them first. Both packages side by side.
        if: ${{ !cancelled() }}
        run: |
          (cd ios-standards/Kobo && swift test > "$RUNNER_TEMP/kobo.log" 2>&1) & kobo=$!
          (cd lift/ios/Packages/LiftKit && swift test > "$RUNNER_TEMP/liftkit.log" 2>&1) & liftkit=$!
          status=0
          wait "$kobo" || status=1
          wait "$liftkit" || status=1
          for name in kobo liftkit; do
            log="$RUNNER_TEMP/$name.log"
            echo "::group::$name (tail)"
            tail -n 20 "$log"
            echo "::endgroup::"
            echo "::group::Unique errors ($name)"
            grep -E "(error|warning):|✘|recorded an issue" "$log" | grep -v "^ *|" | sort -u | head -n 150 || true
            echo "::endgroup::"
          done
          exit "$status"

  test:
    # The app's unit tests on a simulator, from the build job's products. It starts with the build job rather
    # than after it, so the simulator has booted when the products arrive.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # ci-products.sh polls this run's artifacts and jobs
    concurrency:
      group: ios-test-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          # Notes how long the boot took, for the timing printed before the simulator is used.
          (start=$SECONDS; xcrun simctl bootstatus "$udid" -b > /dev/null 2>&1
            echo "simulator booted after $((SECONDS - start)) s, at $(date -u +%T)" > "$RUNNER_TEMP/booted") &
      - name: Wait for the build job's products
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: lift/ios/scripts/ci-products.sh fetch lift-products build/products
      - name: Wait for the simulator
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          cat "$RUNNER_TEMP/booted" || true
      - name: Unit test
        if: ${{ !cancelled() }}
        run: lift/ios/scripts/ci-xcodebuild.sh test lift-test.log build/products/*.xctestrun

  screenshots:
    # Demo screenshots, one job per variant (light, dark, AX3), from the build job's products. Like the test job
    # it starts with the build job and boots its simulator while it waits.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # ci-products.sh polls this run's artifacts and jobs
    strategy:
      fail-fast: false
      matrix:
        variant: [light, dark, ax3]
    concurrency:
      group: ios-shots-${{ matrix.variant }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Boot a simulator in the background
        run: |
          udid="$(lift/ios/scripts/simulator.sh)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
          # Notes how long the boot took, for the timing printed before the simulator is used.
          (start=$SECONDS; xcrun simctl bootstatus "$udid" -b > /dev/null 2>&1
            echo "simulator booted after $((SECONDS - start)) s, at $(date -u +%T)" > "$RUNNER_TEMP/booted") &
      - name: Wait for the build job's products
        env:
          GH_TOKEN: ${{ github.token }}
        run: lift/ios/scripts/ci-products.sh fetch lift-products build/products
      - name: Wait for the simulator
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          cat "$RUNNER_TEMP/booted" || true
      - name: Screenshots
        env:
          VARIANTS: ${{ matrix.variant }}
        run: |
          top -l 1 -o cpu -n 12 -stats pid,command,cpu,mem | tail -n 13
          lift/ios/scripts/screenshots.sh build/products/Debug-iphonesimulator/Lift.app screenshots
          top -l 1 -o cpu -n 12 -stats pid,command,cpu,mem | tail -n 13
      - name: Simulator disk use
        if: ${{ !cancelled() }}
        run: |
          du -sh ~/Library/Developer/CoreSimulator/Devices/"$SIM_UDID" ~/Library/Developer/CoreSimulator/Caches \
            /Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          ls -la ~/Library/Developer/CoreSimulator/Caches/dyld /Library/Developer/CoreSimulator/Caches/dyld 2>/dev/null || true
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lift-screenshots-${{ matrix.variant }}
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
