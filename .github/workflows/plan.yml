# The cloud coach: plans a week with Claude Code, and sends the plan to Coach as a proposal. Paolo accepts or rejects
# it on the Plan page; only an accept writes the plan, the calendar, Lift and Garmin (plan-apply.yml).
# - Sunday 15:00 UTC (08:00 PDT): next week, with no answers (the agent decides from the data).
# - By hand or from the Plan page ("Plan with Coach", which dispatches it with proposal_id): any week, with answers.
#
# The agent gets no secrets but its own login, and only the Read, Glob, Grep and Write (plans/) tools, plus one
# command, the rule check (scripts/check-plan.mjs, no database or network): the steps
# before and after it hold the database URL and CRON_SECRET. Calendar text in the profile is untrusted; the Accept is
# the gate (scripts/plan-cloud/PROMPT.md).
# Secrets: PROD_DATABASE_URL, CRON_SECRET, and CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY.
name: Plan (cloud)

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      proposal_id:
        description: The request from the Plan page (empty for a new weekly plan of next week)
        required: false
        default: ""

concurrency: plan

permissions:
  contents: read

env:
  COACH_URL: https://coach.paolobernasconi.com
  AGENT_OUTPUT: /tmp/coach-agent-output.txt # the agent's answer, kept out of the public log

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Agent login set up?
        id: ready
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::Set CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY to plan in the cloud."
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.ready.outputs.ok == 'true' || inputs.proposal_id != ''
        run: npm ci --no-audit --no-fund

      - name: Claim the request
        if: steps.ready.outputs.ok == 'true' || inputs.proposal_id != ''
        id: claim
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
        run: node scripts/plan-cloud/client.mjs claim "$PROPOSAL_ID" >> "$GITHUB_OUTPUT"

      - name: Athlete profile
        if: steps.claim.outputs.id
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          WEEK: ${{ steps.claim.outputs.week }}
          KIND: ${{ steps.claim.outputs.kind }}
        run: |
          node scripts/coach-profile.mjs --no-sync --week-of "$WEEK"
          if [ "$KIND" = "checkin" ]; then node scripts/plan-edit.mjs show "$WEEK" > plans/current-week.txt; fi

      - name: Plan (Claude Code)
        if: steps.claim.outputs.id
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@2.1.304 -p "$(cat scripts/plan-cloud/PROMPT.md)" \
            --model claude-opus-5-5 \
            --tools Read Glob Grep Write Bash \
            --allowedTools Read Glob Grep "Edit(plans/**)" "Bash(node scripts/check-plan.mjs:*)" \
            --permission-mode dontAsk \
            --output-format text > "$AGENT_OUTPUT"
          # The repository is public: the agent's answer (health data, calendar) stays out of this log.
          echo "The agent finished ($(wc -c < "$AGENT_OUTPUT") bytes of output, not printed)."

      - name: Send the plan to Coach
        if: steps.claim.outputs.id
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ID: ${{ steps.claim.outputs.id }}
          WEEK: ${{ steps.claim.outputs.week }}
        run: node scripts/plan-cloud/client.mjs submit "$ID" "$WEEK"

      - name: Record the failure in Coach
        if: failure() && steps.claim.outputs.id
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ID: ${{ steps.claim.outputs.id }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/plan-cloud/client.mjs fail "$ID" "The plan job failed: $RUN"
