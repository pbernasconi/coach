# Edits Lift templates from a file in lift/tools/LiftSeed/edits/ (LiftSeed --add: Lift's own repositories and sync, so
# the iPhone gets the change on its next sync). A dry run prints the templates and what would change; with push, it
# writes the change and starts Plan apply, so upcoming Lift sessions that were not started get the new slots.
# Secrets: LIFT_SYNC_TOKEN.
name: Lift templates

on:
  workflow_dispatch:
    inputs:
      edits:
        description: File in lift/tools/LiftSeed/edits/
        required: true
        default: curls.json
      push:
        description: Write the change (otherwise a dry run)
        type: boolean
        default: false

concurrency: plan-apply

permissions:
  contents: read
  actions: write

jobs:
  edit:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Edit the templates
        env:
          LIFT_SYNC_TOKEN: ${{ secrets.LIFT_SYNC_TOKEN }}
          EDITS: ${{ inputs.edits }}
          PUSH: ${{ inputs.push && '--push' || '' }}
        run: |
          case "$EDITS" in */*|..*) echo "edits must be a file name in lift/tools/LiftSeed/edits/"; exit 1;; esac
          swift run -q --package-path lift/tools/LiftSeed LiftSeed --db "$RUNNER_TEMP/lift.sqlite" \
            --server https://coach.paolobernasconi.com --add "lift/tools/LiftSeed/edits/$EDITS" $PUSH
      - name: Plan the upcoming lifts again
        if: inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run plan-apply.yml --repo "$GITHUB_REPOSITORY"
