---
name: Push test

# Sends test pushes to Lift through POST /api/app/push/test (lift/PUSH.md): "test" is the plain Coach test, the others
# replay the real notice for the latest Lift session, Strava activity or weigh-in, with its deep link. Prints what
# APNs answered (status and device counts, no content). Secret: LIFT_SYNC_TOKEN (the same value as in Vercel).
"on":
  workflow_dispatch:
    inputs:
      kind:
        description: Which notice
        type: choice
        default: all
        options: [all, test, lift, strava, weigh_in]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          LIFT_SYNC_TOKEN: ${{ secrets.LIFT_SYNC_TOKEN }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" = all ]; then kinds="lift strava weigh_in"; else kinds="$KIND"; fi
          for kind in $kinds; do
            if [ "$kind" = test ]; then body=''; else body="{\"replay\":\"$kind\"}"; fi
            echo "$kind: $(curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $LIFT_SYNC_TOKEN" \
              -H 'content-type: application/json' ${body:+-d "$body"} https://coach.paolobernasconi.com/api/app/push/test)"
            sleep 3
          done
