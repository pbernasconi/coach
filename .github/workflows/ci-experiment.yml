name: CI experiment (temporary)
on:
  pull_request:
    paths: [".github/workflows/ci-experiment.yml"]
permissions:
  contents: read
jobs:
  dyld:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: dyld cache before boot
        run: |
          sudo du -sh /Library/Developer/CoreSimulator/Caches/dyld/*/* 2>/dev/null || echo "no dyld cache dir"
          xcrun simctl list runtimes | grep -i ios
          sysctl -n hw.ncpu; sysctl -n hw.memsize
      - name: Boot and time launches
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in sorted(d.items()) if 'iOS-26' in k for x in v if x['name'].startswith('iPhone 17')][0])")
          echo "device $UDID"
          s=$SECONDS; xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b >/dev/null; echo "boot: $((SECONDS-s)) s"
          sudo du -sh /Library/Developer/CoreSimulator/Caches/dyld/*/* 2>/dev/null || true
          ps aux | grep -i "update_dyld\|dyld_sim" | grep -v grep | head -3 || true
          for i in 1 2 3; do s=$SECONDS; xcrun simctl launch $UDID com.apple.Preferences >/dev/null; echo "launch $i: $((SECONDS-s)) s"; xcrun simctl terminate $UDID com.apple.Preferences; done
          sudo du -sh /Library/Developer/CoreSimulator/Caches/dyld/*/* 2>/dev/null || true
          sudo find /Library/Developer/CoreSimulator/Caches/dyld -name "*.txt" -exec tail -3 {} \; 2>/dev/null | head
