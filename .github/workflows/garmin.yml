# Pulls Garmin Connect data (HRV, sleep, Body Battery, readiness, training status, race predictions ...)
# with the unofficial Garmin Connect API. It posts daily metrics to /api/vitals/sync and every raw response to /api/vitals/garmin/raw.
# The Garmin tokens live in Coach, encrypted with GARMIN_TOKEN_KEY (only GitHub and Paolo's Mac have it).
# Each run catches up from the last synced day, so missed runs fill in. A backfill (input `since`) is resumable:
# Coach records its progress, and every run continues it until it is done. Setup: scripts/garmin/README.md.
name: Garmin

on:
  schedule:
    - cron: "0 11 * * *" # 04:00 PDT / 03:00 PST: last night's sleep and HRV are in Garmin Connect
    - cron: "0 17 * * *" # 10:00 PDT: the morning, in case the watch synced late
  workflow_dispatch:
    inputs:
      since:
        description: Backfill from this day, YYYY-MM-DD (for example 2025-04-20). Run it again to resume.
        required: false
        default: ""
      days:
        description: At least this many days, ending today (empty for the catch-up window)
        required: false
        default: ""

permissions: {}

# One run at a time: two runs could both refresh the Garmin tokens. A new run waits for the old one.
concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  garmin:
    runs-on: ubuntu-latest
    # About 16 s per day (12 Garmin calls). A scheduled run spends at most 45 minutes on an unfinished backfill;
    # a manual run 300 minutes (about 1,100 days). The timeout is only a backstop: progress is saved per week.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/garmin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/garmin/requirements.txt
      - name: Install
        run: |
          pip install -r scripts/garmin/requirements.txt
      - name: Sync
        working-directory: scripts/garmin
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
          # Seed only: used when Coach has no tokens yet (the first run after setup).
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COACH_URL: https://coach.paolobernasconi.com
          DAYS: ${{ inputs.days }}
          SINCE: ${{ inputs.since }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ -n "$DAYS" ]; then args+=(--days "$DAYS"); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--max-minutes 300)
          else
            args+=(--max-minutes 45)
          fi
          python sync.py "${args[@]}"
