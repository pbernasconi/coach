# Also puts Coach's planned runs on the Garmin calendar as structured workouts (workouts.py), and stores the watch's
# recent activities (activities.py: training effect, running dynamics, stamina). The Strava webhook starts a run
# with `activities` a few seconds after each workout, so the watch's numbers are in Coach about a minute later.
# Pulls Garmin Connect data (HRV, sleep, Body Battery, readiness, training status, race predictions ...)
# with the unofficial Garmin Connect API. It posts daily metrics to /api/vitals/sync and every raw response to /api/vitals/garmin/raw.
# The Garmin tokens live in Coach, encrypted with GARMIN_TOKEN_KEY (only GitHub and Paolo's Mac have it).
# Each run catches up from the last synced day, so missed runs fill in. A backfill (input `since`) is resumable:
# Coach records its progress, and every run continues it until it is done. Setup: scripts/garmin/README.md.
#
# When: after each hourly Sync run (sync.yml), while the database is awake, the data too once the last data sync is
# 2 hours old (--fresh-hours), else only the workouts. GitHub starts scheduled runs late (3 to 5 hours on 2026-10-20
# and 21) or skips them, so the data does not wait for one fixed run; the crons below are a backstop, off the hour,
# when GitHub is less busy.
name: Garmin

on:
  schedule:
    - cron: "17 11 * * *" # 04:17 PDT / 03:17 PST; :17 is the minute of Sync (sync.yml), so one database wake-up
    - cron: "17 14 * * *" # 07:17 PDT: last night's sleep, once the watch has synced
    - cron: "17 17 * * *" # 10:17 PDT
  workflow_run:
    workflows: [Sync]
    types: [completed]
  workflow_dispatch:
    inputs:
      since:
        description: Backfill from this day, YYYY-MM-DD (for example 2025-04-20). Run it again to resume.
        required: false
        default: ""
      days:
        description: At least this many days, ending today (empty for the catch-up window)
        required: false
        default: ""
      workouts_only:
        description: Only put Coach's planned runs on the Garmin calendar (what /plan and /check-in start)
        type: boolean
        required: false
        default: false
      activities:
        description: Only the watch's recent activities (what the Strava webhook starts after a workout)
        type: boolean
        required: false
        default: false

permissions: {}

# One run at a time: two runs could both refresh the Garmin tokens. A new run waits for the old one. The
# post-workout run has its own group, so it never waits behind a long backfill or is dropped as a second pending
# run; a token clash is handled by the job (it retries with the newer tokens Coach has).
concurrency:
  group: ${{ inputs.activities && 'garmin-activities' || 'garmin' }}
  cancel-in-progress: false

jobs:
  garmin:
    runs-on: ubuntu-latest
    # About 16 s per day (12 Garmin calls). A scheduled run spends at most 45 minutes on an unfinished backfill;
    # a manual run 300 minutes (about 1,100 days). The timeout is only a backstop: progress is saved per week.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/garmin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/garmin/requirements.txt
      - name: Install
        run: |
          pip install -r scripts/garmin/requirements.txt
      - name: Sync
        working-directory: scripts/garmin
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
          # Seed only: used when Coach has no tokens yet (the first run after setup).
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COACH_URL: https://coach.paolobernasconi.com
          DAYS: ${{ inputs.days }}
          SINCE: ${{ inputs.since }}
          EVENT: ${{ github.event_name }}
          WORKOUTS_ONLY: ${{ inputs.workouts_only }}
          ACTIVITIES: ${{ inputs.activities }}
        run: |
          args=()
          if [ "$ACTIVITIES" = "true" ]; then
            python sync.py --activities --delay 0.3
            exit $?
          fi
          if [ "$WORKOUTS_ONLY" = "true" ]; then
            python sync.py --workouts-only
            exit $?
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            python sync.py --fresh-hours 2 --max-minutes 10
            exit $?
          fi
          if [ -n "$DAYS" ]; then args+=(--days "$DAYS"); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--max-minutes 300)
          else
            args+=(--max-minutes 45)
          fi
          python sync.py "${args[@]}"
