name: Function Health sync

# Lab results change only after a blood draw, so this runs by hand: Actions → Function Health sync → Run workflow,
# or `gh workflow run function.yml`. The job reads Function and sends the results to Coach (POST
# /api/vitals/function); it has no database access. It installs no npm packages, so no third-party code runs next
# to the Function password.
on:
  workflow_dispatch:

concurrency: function

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/function-sync.mjs
            src/lib/vitals
            src/lib/db-time.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Sync
        env:
          FUNCTION_EMAIL: ${{ secrets.FUNCTION_EMAIL }}
          FUNCTION_PASSWORD: ${{ secrets.FUNCTION_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/function-sync.mjs
