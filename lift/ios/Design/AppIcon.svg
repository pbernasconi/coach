<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app icon's source: the Coach progress ring (src/app/icon.svg), full-bleed (iOS rounds the corners).
       Render at 1024 px with no alpha into Lift/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png:
       python3 -c "import cairosvg; cairosvg.svg2png(url='AppIcon.svg', write_to='a.png', output_width=1024, output_height=1024)"
       convert a.png -background '#141413' -alpha remove -alpha off -strip PNG24:AppIcon.png -->
  <rect width="32" height="32" fill="#141413"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3.2"/>
  <path d="M16 8A8 8 0 1 0 23.6 18.5" fill="none" stroke="#eb6834" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="23.6" cy="18.5" r="1.25" fill="#fff"/>
</svg>
