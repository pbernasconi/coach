# XcodeGen spec for Lift: the committed source of truth (LAY-1).
# `scripts/generate.sh` writes Lift.xcodeproj, which is gitignored. Never edit the project by hand.
name: Lift
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
packages:
  LiftKit: { path: Packages/LiftKit }
  Kobo: { path: ../../ios-standards/Kobo }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""   # set locally or via CI secret
    LIFT_BUNDLE_ID: com.example.lift   # placeholder; the TestFlight job overrides it from the LIFT_BUNDLE_ID variable
    # The coach web app's origin for sync (https://…), copied into Info.plist as LiftSyncBaseURL. Empty keeps sync
    # off; the TestFlight job can pass it (xcodebuild LIFT_SYNC_BASE_URL=https://…). Demo data never syncs.
    LIFT_SYNC_BASE_URL: ""
    # The App Group the app shares with LiftWidgets (the rest Live Activity's +30s and Skip) and LiftShare (the shared
    # note inbox). Each target's entitlements and Info.plist (LiftAppGroup) take it from here.
    LIFT_APP_GROUP: group.$(LIFT_BUNDLE_ID)
targets:
  Lift:
    type: application
    platform: iOS
    sources: [Lift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFT_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"                   # iPhone only; XcodeGen's app preset would otherwise add iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Resources/Assets.xcassets, one 1024 pt universal icon
        SWIFT_EMIT_LOC_STRINGS: "YES"                 # fills Resources/Localizable.xcstrings on build (UI-8)
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    dependencies:
      - package: LiftKit
        products: [LiftCore, LiftStore, LiftSync]
      - package: Kobo
        products: [KoboTokens, KoboComponents, KoboPatterns]
      - target: LiftWidgets                           # embedded in PlugIns/; draws the rest Live Activity
      - target: LiftShare                             # embedded in PlugIns/; Share a note from Apple Notes
    entitlements:
      path: Lift/Lift.entitlements
      properties:
        # App Group entitlement left out until group.$(LIFT_BUNDLE_ID) is registered and assigned to the three App IDs
        # (lift/DEFERRED.md). Without it the app works; the Share extension cannot hand notes over yet.
        # Apple Health: Lift saves finished workouts (write only, no clinical records).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Lift/Info.plist
      properties:
        CFBundleDisplayName: Lift
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Shown in the Health permission sheet, which opens after the first finished workout's prompt.
        NSHealthUpdateUsageDescription: >-
          Lift saves each workout you finish to Apple Health as strength training, with its start and end time.
        # Required by App Store validation because the HealthKit entitlement is present; Lift only writes workouts.
        NSHealthShareUsageDescription: >-
          Lift does not read your Health data. It only saves the workouts you finish.
        LiftSyncBaseURL: $(LIFT_SYNC_BASE_URL)
        LiftAppGroup: $(LIFT_APP_GROUP)
        # lift://import opens Import from Notes; lift://templates opens the template link review (AppLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: $(LIFT_BUNDLE_ID)
            CFBundleURLSchemes: [lift]
  LiftWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LiftWidgets
      # Compiled by both the app and the extension: the Live Activity's attributes, and the +30s and Skip intents with
      # the shared rest they change.
      - Lift/Features/Workout/LiveActivity/RestActivityAttributes.swift
      - Lift/Features/Workout/LiveActivity/RestSnapshot.swift
      - Lift/Features/Workout/LiveActivity/RestSnapshotStore.swift
      - Lift/App/RestActivityIntents.swift
      - Lift/App/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFT_BUNDLE_ID).widgets   # must start with the app's bundle id
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LIFT_EXTENSION
    entitlements:
      path: LiftWidgets/LiftWidgets.entitlements
      properties: {}   # App Group left out for now; see the Lift target.
    info:
      path: LiftWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lift
        LiftAppGroup: $(LIFT_APP_GROUP)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
  LiftShare:
    type: app-extension
    platform: iOS
    sources:
      - LiftShare
      # Compiled by both the app and the extension: the App Group, the note inbox and the lift://import link.
      - Lift/App/AppGroup.swift
      - Lift/App/AppLink.swift
      - Lift/Features/Import/NoteInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFT_BUNDLE_ID).share   # must start with the app's bundle id
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LIFT_EXTENSION
    entitlements:
      path: LiftShare/LiftShare.entitlements
      properties: {}   # App Group left out for now; see the Lift target.
    info:
      path: LiftShare/Info.plist
      properties:
        CFBundleDisplayName: Lift
        LiftAppGroup: $(LIFT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
  LiftTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFT_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Lift
      - package: LiftKit
        products: [LiftTesting, LiftSync]
schemes:
  Lift:
    build: { targets: { Lift: all } }
    run: { config: Debug }
    test: { config: Debug, gatherCoverageData: true, targets: [LiftTests] }
    archive: { config: Release }
